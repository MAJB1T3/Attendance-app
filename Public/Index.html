<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b4ccc">
<title>Attendance</title>
<style>
  :root{
    --bg:#f4f5fb; --card:#fff; --ink:#1b1f3a; --muted:#6b7090; --line:#e3e5f1;
    --brand:#3b4ccc; --brand-ink:#fff; --ok:#14804a; --ok-bg:#e1f5ea; --warn:#a15c00; --warn-bg:#fff0d6;
    --bad:#b3261e; --bad-bg:#fde7e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:680px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  header.top h1{font-size:20px;margin:0}
  header.top small{color:var(--muted);display:block;font-size:13px}
  h2{font-size:16px;margin:24px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--muted)}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
  button,.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;
       background:var(--brand);color:var(--brand-ink);text-decoration:none;text-align:center}
  button.full,.btn.full{width:100%}
  button.ghost,.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
  button.danger{background:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:6px;background:#e8eaf7;padding:4px;border-radius:12px;margin-bottom:12px}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:10px}
  .tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
  .badge.open{background:var(--ok-bg);color:var(--ok)}
  .badge.closed{background:#eceef6;color:var(--muted)}
  .badge.pending{background:var(--warn-bg);color:var(--warn)}
  .muted{color:var(--muted);font-size:14px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700}
  .big{font-size:18px;font-weight:700}
  .mark{margin-top:12px;padding:16px;font-size:17px}
  .done{margin-top:12px;padding:12px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:600;text-align:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .scroll{overflow-x:auto}
  .link{background:none;border:0;color:var(--brand);padding:6px;font-weight:600;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1f3a;color:#fff;
         padding:12px 18px;border-radius:12px;max-width:90vw;z-index:9;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.bad{background:var(--bad)}
  .item{cursor:pointer}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ------------------------------------------------------------ basics */
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
let API = store.get('api_base') || '';           // empty = same server that served this page
const S = { token: store.get('token'), role: store.get('role'), user: null };
try { S.user = JSON.parse(store.get('user') || 'null'); } catch {}
let offset = 0;                                   // server clock minus phone clock (ms)
const nowMs = () => Date.now() + offset;
let refreshFn = null, pollId = null;

function deviceId(){
  let d = store.get('device_id');
  if (!d) {
    d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : 'dev-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    store.set('device_id', d);
  }
  return d;
}

function toast(msg, bad){
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

async function api(path, { method = 'GET', body } = {}){
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  let r;
  try { r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error('Cannot reach the server. Check your internet or the server address.'); }
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && S.token) { logout(); throw new Error(data.error || 'Please log in again'); }
  if (!r.ok) throw new Error(data.error || 'Something went wrong');
  if (data.server_time) offset = Date.parse(data.server_time) - Date.now();
  return data;
}

function saveLogin(d, role){
  S.token = d.token; S.role = role; S.user = d.user;
  store.set('token', d.token); store.set('role', role); store.set('user', JSON.stringify(d.user));
}
function logout(){
  S.token = S.role = S.user = null;
  ['token','role','user'].forEach(store.del);
  stopPolling();
  viewAuth();
}

const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtDate = (iso) => new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDT = (iso) => fmtDate(iso) + ', ' + new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function startPolling(fn, ms){
  stopPolling();
  refreshFn = fn;
  pollId = setInterval(() => { if (!document.hidden) fn(true); }, ms);
}
function stopPolling(){ clearInterval(pollId); pollId = null; refreshFn = null; }

/* live countdowns: any element with data-end="ISO" */
setInterval(() => {
  document.querySelectorAll('[data-end]').forEach((el) => {
    const left = Math.max(0, Date.parse(el.dataset.end) - nowMs());
    if (left <= 0) {
      el.textContent = 'Closed';
      if (el.dataset.reload && refreshFn && !el.dataset.fired) { el.dataset.fired = '1'; refreshFn(true); }
    } else {
      const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ' left';
    }
  });
}, 1000);

function busy(btn, on, label){
  if (!btn) return;
  btn.disabled = on;
  if (label) btn.textContent = on ? 'Please wait...' : label;
}

/* ------------------------------------------------------------ login / register */
function viewAuth(role = 'student', action = 'login'){
  stopPolling();
  const isS = role === 'student', reg = action === 'register';
  $app.innerHTML = `
    <header class="top"><div><h1>Attendance</h1><small>Sign in to continue</small></div></header>
    <div class="tabs">
      <button type="button" data-role="student" class="${isS ? 'on' : ''}">Student</button>
      <button type="button" data-role="lecturer" class="${!isS ? 'on' : ''}">Lecturer</button>
    </div>
    <form class="card" id="authForm" autocomplete="on">
      <div class="big">${reg ? 'Create account' : 'Log in'}</div>
      ${reg ? `<label>Full name</label><input name="name" required autocomplete="name">` : ''}
      ${isS
        ? `<label>Matric number</label><input name="matric" required autocapitalize="characters" autocomplete="username">`
        : `<label>Email</label><input name="email" type="email" required autocomplete="username">`}
      <label>Password</label><input name="password" type="password" required minlength="${reg ? 6 : 1}" autocomplete="${reg ? 'new-password' : 'current-password'}">
      ${reg && !isS ? `<label>Lecturer invite code</label><input name="invite_code" required>` : ''}
      <div style="margin-top:16px"><button class="full" id="authBtn">${reg ? 'Create account' : 'Log in'}</button></div>
      <div class="row" style="margin-top:10px;justify-content:center">
        <button type="button" class="link" id="toggle">${reg ? 'I already have an account' : 'Create a new account'}</button>
      </div>
    </form>
    <div style="text-align:center"><button class="link" id="srv">Server address${API ? ': ' + esc(API) : ''}</button></div>`;

  $app.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => viewAuth(b.dataset.role, action)));
  $app.querySelector('#toggle').onclick = () => viewAuth(role, reg ? 'login' : 'register');
  $app.querySelector('#srv').onclick = () => {
    const v = prompt('Server address (leave empty to use this page\'s server)', API || 'https://');
    if (v === null) return;
    API = v.trim().replace(/\/+$/, '');
    API ? store.set('api_base', API) : store.del('api_base');
    viewAuth(role, action);
  };
  $app.querySelector('#authForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $app.querySelector('#authBtn');
    const body = Object.fromEntries(new FormData(e.target).entries());
    busy(btn, true);
    try {
      const d = await api(`/api/${role}/${action}`, { method: 'POST', body });
      saveLogin(d, role);
      route();
    } catch (err) { toast(err.message, true); busy(btn, false, reg ? 'Create account' : 'Log in'); }
  };
}

function topbar(title, sub){
  return `<header class="top"><div><h1>${esc(title)}</h1><small>${esc(sub)}</small></div>
          <button class="ghost" id="logout">Log out</button></header>`;
}

/* ------------------------------------------------------------ student */
async function viewStudent(silent){
  if (!silent) $app.innerHTML = topbar('Hello, ' + (S.user?.name || 'student'), S.user?.matric_no || '') + '<div class="empty">Loading...</div>';
  let act, hist;
  try { [act, hist] = await Promise.all([api('/api/student/sessions/active'), api('/api/student/history')]); }
  catch (err) { if (S.token) toast(err.message
